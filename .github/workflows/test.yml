name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    # 后端只剩 PostgreSQL（ADR 0089）：测试库由 conftest 在会话开始时用
    # migrations/pg/*.sql 重建（0001 是 bootstrap-only，只在空库可跑）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luyun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LUYUN_TEST_DSN: postgresql://postgres:postgres@localhost:5432/luyun_test
      LUYUN_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python3 -m pytest tests/ -v

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify PWA artifacts
        working-directory: .
        run: |
          test -f admin-web/dist/sw.js
          test -f admin-web/dist/pwa/manifests/admin.webmanifest
          test -f admin-web/dist/pwa/manifests/hygiene.webmanifest
          test -f admin-web/dist/pwa/manifests/recipe.webmanifest
      - name: Run tests
        run: npm run test

  kds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
