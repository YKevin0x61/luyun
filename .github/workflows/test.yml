name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    # 后端只剩 PostgreSQL（ADR 0089）：测试库由 conftest 在会话开始时用
    # migrations/pg/*.sql 重建（0001 是 bootstrap-only，只在空库可跑）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luyun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LUYUN_TEST_DSN: postgresql://postgres:postgres@localhost:5432/luyun_test
      LUYUN_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      # CI 上真 Redis 是硬要求：带这个变量时 tests/test_realtime_redis_bus.py 里
      # 真 Redis 的用例**不许**被条件跳过（跳过了 Redis 回归就等于没跑，见 TEST-11）。
      LUYUN_TEST_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Redis 是部署必需组件（ADR 0090，realtime nudge 跨进程广播）：应用没配
      # REDIS_URL 启动即失败，Bootstrap 的前置检查也会硬失败，所以 runner 上必须
      # 有 redis-server/redis-cli。**而且必须真起起来**：真 Redis 的集成用例是
      # 条件跳过（`skipUnless(redis_available(), …)`），apt 装完不启动只会记一条
      # skip、整体仍然全绿——这正是 2026-09-23 检核 TEST-11 的假绿形态。
      # 所以这里装完就起服务并当场探活，下面再用一步专盯「有跳过就是失败」。
      - name: Install and start redis (required component)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
          sudo service redis-server start || redis-server --daemonize yes
          redis-cli ping | grep -q PONG
      - name: Real-Redis regression must not be skipped
        run: |
          if ! out=$(python3 -m pytest tests/test_realtime_redis_bus.py -q -rs); then
            echo "$out"
            exit 1
          fi
          echo "$out"
          if echo "$out" | grep -qE '[0-9]+ skipped'; then
            echo "::error::tests/test_realtime_redis_bus.py 有用例被跳过：真 Redis 回归在 CI 上退化成假绿（TEST-11 / ADR 0090）"
            exit 1
          fi
      - name: Run unit tests
        run: python3 -m pytest tests/ -v

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify PWA artifacts
        working-directory: .
        run: |
          test -f admin-web/dist/sw.js
          test -f admin-web/dist/pwa/manifests/admin.webmanifest
          test -f admin-web/dist/pwa/manifests/hygiene.webmanifest
          test -f admin-web/dist/pwa/manifests/recipe.webmanifest
      - name: Run tests
        run: npm run test

  kds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
