# Docker / 1Panel process-shell deploy (ADR 0011).
#
# Critical: mount the PARENT of the live app dir, not the app dir itself.
# Update Job renames app ↔ app.prev / app.next on the same filesystem;
# mounting only ./runtime/app as a volume would make that rename fail.
#
# From repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.docker up -d --build
#
# Or: ./scripts/docker_up.sh
#
# Delivery remains GitHub Release Bundle (Admin「系统更新」); image pull is not
# the shop upgrade path.

name: luyun

services:
  luyun:
    container_name: ${LUYUN_DOCKER_CONTAINER:-luyun}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${LUYUN_DOCKER_IMAGE:-luyun:local}
    restart: unless-stopped
    working_dir: /srv/luyun/app
    ports:
      - "${LUYUN_HOST_PORT:-8000}:8000"
    environment:
      LUYUN_APP_DIR: /srv/luyun/app
      LUYUN_DEPLOY_MODE: docker
      LUYUN_DOCKER_CONTAINER: ${LUYUN_DOCKER_CONTAINER:-luyun}
      LUYUN_DOCKER_SOCK: /var/run/docker.sock
      RELEASE_UPDATE_REPO_DIR: /srv/luyun/app
      GITHUB_REPO: ${GITHUB_REPO:-YKevin0x61/luyun}
      GITHUB_RELEASES_TOKEN: ${GITHUB_RELEASES_TOKEN:-}
      LUYUN_TAG: ${LUYUN_TAG:-latest}
      LUYUN_DOCKER_AUTO_BOOTSTRAP: ${LUYUN_DOCKER_AUTO_BOOTSTRAP:-1}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      # Parent mount — live tree is /srv/luyun/app on this volume.
      # 必须给绝对路径：相对路径由 compose 按项目目录解析，一旦调用方式/cwd 变了
      # 就会静默挂到别的目录（现场踩过：连上一份新建的空 SQLite 且不报错）。
      # scripts/docker_up.sh 会绝对化后导出；手工 compose 请自己给绝对路径。
      - ${LUYUN_HOST_PARENT:?请在 .env.docker 里设置绝对路径，例如 /opt/luyun/deploy/runtime}:/srv/luyun
      - /var/run/docker.sock:/var/run/docker.sock
    # 应用起不来应该是「库没起来」而不是「连不上库」：等 PG healthcheck 过了再起。
    depends_on:
      postgres:
        condition: service_healthy
    # Single worker is enforced in entrypoint CMD; do not scale replicas.
    # deploy.replicas intentionally omitted (Compose v2 ignore is fine).

# ── PostgreSQL（唯一后端，ADR 0089）────────────────────────────────────
# SQLite 退场后 PG 不再是可选组件：`docker compose up` 会连同 luyun 一起起它，
# 应用侧配置在 deploy/env.production 里：
#   DATABASE_BACKEND=postgres
#   POSTGRES_DSN=postgresql://luyun:<密码>@postgres:5432/luyun
#
# 容器首次启动会按 POSTGRES_* 建库建用户，但**不会建表**——schema 由
# migrations/pg/0001_initial_schema.sql 负责（见 migrations/pg/README.md）。
  postgres:
    image: postgres:16-alpine
    container_name: ${LUYUN_PG_CONTAINER:-luyun-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luyun}
      POSTGRES_USER: ${POSTGRES_USER:-luyun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      # 与业务侧 CHINA_TZ 对齐，避免时间戳字面量因时区不同产生偏差
      TZ: Asia/Shanghai
    volumes:
      - ${LUYUN_PG_DATA:?请设置绝对路径，例如 /opt/luyun/deploy/runtime/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luyun} -d ${POSTGRES_DB:-luyun}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis：realtime nudge 的跨进程广播已接入（services/realtime/redis_bus.py；
  # 应用侧配 REDIS_URL，见 deploy/README.md 10.1.1）。不配 URL 时它是惰性组件
  # ——先起容器不改变任何行为，配上 URL 才生效。
  # 这里**没有**发布端口：只有同一 compose 网络里的容器连得上，URL 用服务名
  # `redis://redis:6379/0`。要让宿主机上的进程也连它，自行加一行
  #   ports: ["127.0.0.1:6379:6379"]
  # 「必须单 worker」仍未解除：日志缓冲、爬虫计数器与那 7 个常驻后台循环都还
  # 没有外置 / 选主，多开 worker 仍会重复采集、重复推送。
  redis:
    image: redis:7-alpine
    profiles: ["pg"]
    container_name: ${LUYUN_REDIS_CONTAINER:-luyun-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${LUYUN_REDIS_DATA:?请设置绝对路径，例如 /opt/luyun/deploy/runtime/redisdata}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
