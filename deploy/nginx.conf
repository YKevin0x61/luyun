# Nginx 反向代理配置示例，与 deploy/Caddyfile 路由逻辑等价，供偏好 Nginx /
# 已有 Nginx+Certbot 工作流的环境使用（Caddy 仍是本项目首选，自动 HTTPS 更省心）。
#
# 部署前请替换：
#   - server_name your-domain.example.com  → 真实域名
#   - /opt/luyun/admin-web/dist             → admin-web 前端构建产物绝对路径
#     （cd admin-web && npm ci && npm run build，产物在 admin-web/dist）
#   - /opt/luyun/public/kds                 → KDS 构建产物绝对路径（main.py 目前
#     通过 StaticFiles 挂载的就是这个目录，见下方 /kds/ location 注释）
#   - TLS 证书路径（建议用 certbot --nginx 自动申请 Let's Encrypt 证书）
#
# 安装/生效（Debian/Ubuntu 典型路径）：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/luyun.conf
#   sudo ln -s /etc/nginx/sites-available/luyun.conf /etc/nginx/sites-enabled/luyun.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 路由说明（与 deploy/Caddyfile 一致，理由见该文件顶部注释）：
#   - /api/*、/ws/* 反代到本机 127.0.0.1:8000；/ws/ 需要显式声明
#     Upgrade/Connection 头才能完成 WebSocket 升级，否则会被当成普通 HTTP 请求。
#   - 管理后台 SPA（/、/admin、/sales-report、/logs、/prep-plan、/wecom-push、
#     /recipe*）由 admin-web/dist 提供，history 模式路由用 try_files 回退到
#     index.html。
#   - 其余路径（/login、/setup、/vendor/*、/docs 等）反代给后端，因为它们仍由
#     main.py 的 FileResponse / StaticFiles 直接提供。

# WebSocket 升级判断（$http_upgrade 为空则关闭连接，否则升级）。
# map 指令必须位于 http{} 上下文：本文件通过 sites-enabled 被顶层 nginx.conf
# 的 http{} 块 include 进来，所以直接写在这里即可生效。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # 生产建议用 certbot 签发证书后启用 443，并把 80 上的请求 301 跳转到 https：
    # return 301 https://$host$request_uri;

    # listen 443 ssl;
    # listen [::]:443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    # 上传体积上限：备份恢复（/api/backup/import/*）会上传整包 .luyunbak
    # （含 app.db + 配方库），业务数据积累后很容易超过几十 MB，20m 会被 413 挡回。
    # 这里放宽到 512m 以覆盖大备份；如仍不够可按实际最大备份体积继续调大。
    client_max_body_size 512m;
    # 大文件请求体缓冲到临时文件而非全部驻留内存，降低内存压力。
    client_body_buffer_size 1m;

    # ── REST API ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket 实时通道（/ws/realtime）──
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长连接，避免被网关按普通 HTTP 请求的超时时间踢掉
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── admin-web 构建产物里的静态资源（Vite 输出的 /assets/*.js /assets/*.css）──
    # 文件名带内容 hash，可放心长缓存。
    location /assets/ {
        alias /opt/luyun/admin-web/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 管理后台 SPA 页面壳：/admin、/sales-report、/logs、/prep-plan、
    #    /wecom-push、/recipe*，history 模式路由，找不到静态文件时回退到
    #    index.html 交给 vue-router 接管 ──
    location ~ ^/(admin|sales-report|logs|prep-plan|wecom-push|recipe)(/.*)?$ {
        alias /opt/luyun/admin-web/dist/;
        try_files $uri $uri/ /index.html;
    }

    # ── 仪表盘首页（同样是 admin-web SPA，单独处理精确匹配 / ）──
    location = / {
        root /opt/luyun/admin-web/dist;
        try_files /index.html =404;
    }

    # ── KDS 看板：main.py 已通过 StaticFiles 把 public/kds/ 挂载在 /kds，
    #    直接反代给后端最省心，与静态托管二选一 ──
    location /kds/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 静态托管替代方案（与上面 location /kds/ 二选一，注释掉上面那段再启用）：
    # location /kds/ {
    #     alias /opt/luyun/public/kds/;
    #     try_files $uri $uri/ /kds/index.html;
    # }

    # ── 其余一切（/login、/setup、/vendor/*、/common.css、/common.js、
    #    /auth.js、/icons.js、/docs、/openapi.json、/README.md 等）
    #    反代给后端，复用 main.py 已有的静态页面路由与 Swagger UI ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
