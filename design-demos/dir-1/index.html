<div id="root"></div>
<script>
  /* Babel standalone 每次都会 warning「请预编译」，对原型交付没有信息量，也不会真的影响运行；只静音这一条 */
  (function () {
    var raw = console.warn;
    console.warn = function (m) {
      if (typeof m === 'string' && m.indexOf('in-browser Babel transformer') !== -1) return;
      return raw.apply(console, arguments);
    };
  })();
</script>
