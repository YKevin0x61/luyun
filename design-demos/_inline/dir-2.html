<style>
/* dir-2 · 作业流 —— 令牌 + 基础层
   页面里不写裸色值，全部走这里的变量。 */

:root {
  --bg: #0E1110;
  --card: #171C1A;
  --card-2: #1D2321;
  --line: #232A27;
  --line-strong: #2E3733;
  --ink: #E8EEEA;
  --ink-2: #92A39B;
  --ink-3: #6C7C74;
  --brand: #2FB98A;
  --brand-ink: #08110D;
  --amber: #E08B3C;
  --danger: #E2503F;
  --brand-soft: rgba(47, 185, 138, .14);
  --amber-soft: rgba(224, 139, 60, .14);
  --danger-soft: rgba(226, 80, 63, .14);

  /* --danger 做正文色在卡片上只有 4.48:1、在 danger-soft 上 3.89:1，
     都过不了 4.5。文字专用这一档：卡片上 5.26:1，软底上 4.57:1。
     描边与实心块仍然用 --danger。 */
  --danger-ink: #EA6350;

  /* 班次条：只从 --brand 切三档浓淡，不引入新色相；休 / 假用既有灰与红 */
  --shift-am: var(--brand);
  --shift-mid: rgba(47, 185, 138, .66);
  --shift-pm: rgba(47, 185, 138, .4);
  --shift-off: var(--ink-3);
  --shift-leave: var(--danger);

  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --r-card: 12px;
  --r-btn: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
}

body {
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
}

input, textarea, select { font-family: inherit; }

.num { font-variant-numeric: tabular-nums; }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

::selection { background: var(--brand-soft); }

/* 按下 / 悬停：只做状态反馈，不做编排动效 */
.press { transition: opacity .12s ease, background-color .12s ease, border-color .12s ease; }
.press:active { opacity: .82; }

.nav-i { background: transparent; transition: background-color .12s ease; }
.nav-i:hover { background: var(--card-2); }
.nav-i.on, .nav-i.on:hover { background: var(--card); }

.btn-ghost:hover { background: var(--card-2); }
.btn-out:hover { border-color: var(--ink-3); }
.cell:hover { border-color: var(--line-strong); }

/* 滚动条 */
.scrl { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.scrl::-webkit-scrollbar { width: 8px; height: 8px; }
.scrl::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
.scrl::-webkit-scrollbar-track { background: transparent; }

.row-x {
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.row-x::-webkit-scrollbar { display: none; }

</style>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
  /* Babel standalone 每次都会打一条「别在生产用浏览器内编译」的提示，那是工具链
     自己的说明、不是页面问题；只屏蔽这一条，其余 warning 照常暴露。 */
  (function () {
    var warn = console.warn;
    console.warn = function () {
      var first = arguments[0];
      if (typeof first === 'string' && first.indexOf('in-browser Babel transformer') >= 0) return;
      return warn.apply(console, arguments);
    };
  })();
</script>

function Icon(props) {
  const def = UI_ICONS[props.name] || { d: [], c: [] };
  const size = props.size || 18;
  const color = props.color || 'currentColor';
  const solid = props.solid;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
         stroke={color} strokeWidth={props.sw || 1.7} strokeLinecap="round" strokeLinejoin="round"

                fill={solid ? color : 'none'} stroke={solid ? 'none' : color} />
      ))}
    </svg>
  );
}

const UI_PILL = {

  amber: { bg: 'var(--amber-soft)', fg: 'var(--amber)' },
  danger: { bg: 'var(--danger-soft)', fg: 'var(--danger-ink)' },
  neutral: { bg: 'var(--card-2)', fg: 'var(--ink-2)' }
};

function Pill(props) {
  const tone = UI_PILL[props.tone] || UI_PILL.brand;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5, height: 24, padding: '0 9px',
      borderRadius: 999, background: tone.bg, color: tone.fg,
      fontSize: 13, fontWeight: 600, lineHeight: 1, letterSpacing: '-0.01em', whiteSpace: 'nowrap'
    }}>{props.children}</span>
  );
}

function Btn(props) {
  const kind = props.kind || 'solid';
  const h = props.h || 52;
  const base = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7,
    height: h, borderRadius: 'var(--r-btn)', fontSize: props.fs || 16, fontWeight: 600,
    letterSpacing: '-0.01em', cursor: 'pointer', whiteSpace: 'nowrap',
    width: props.w || (props.grow ? '100%' : 'auto'),
    flex: props.grow ? '1 1 auto' : '0 0 auto',
    padding: props.w || props.grow ? '0 16px' : '0 18px'
  };
  let skin;
  if (props.disabled) {
    skin = { background: 'var(--card-2)', color: 'var(--ink-2)', border: '1px solid var(--line)', cursor: 'default' };
  } else if (kind === 'solid') {
    skin = { background: 'var(--brand)', color: 'var(--brand-ink)', border: '1px solid var(--brand)' };
  } else if (kind === 'danger') {
    skin = { background: 'var(--bg)', color: 'var(--danger-ink)', border: '1px solid var(--danger)' };
  } else if (kind === 'outline') {
    skin = { background: 'transparent', color: 'var(--ink)', border: '1px solid var(--line-strong)' };
  } else {
    skin = { background: 'transparent', color: 'var(--ink-2)', border: '1px solid transparent' };
  }
  return (
    <button className={'press btn-' + (props.disabled ? 'off' : 'on')} onClick={props.disabled ? undefined : props.onClick}
            disabled={props.disabled ? true : undefined} style={Object.assign({}, base, skin, props.style)}>
      {props.icon ? <Icon name={props.icon} size={17} /> : null}
      {props.children}
    </button>
  );
}

function Card(props) {
  return (
    <div style={Object.assign({
      background: 'var(--card)', border: '1px solid var(--line)',
      borderRadius: 'var(--r-card)', padding: props.pad || 16

  );
}

function Underline(props) {
  const w = props.w || 24;
  return <span style={{ display: 'block', width: w, height: 3, borderRadius: 1.5, background: 'var(--amber)', marginTop: props.mt === undefined ? 8 : props.mt }} />;
}

}

}

/* ---------- SVG 折线 ---------- */
function LineChart(props) {
  const days = props.days;
  const W = 326, H = 166;
  const padL = 46, padR = 16, padT = 24, padB = 30;
  const y0 = 20000, y1 = 32000;
  const iw = W - padL - padR;
  const ih = H - padT - padB;
  const px = i => padL + (iw * i) / (days.length - 1);
  const py = v => padT + ih * (1 - (v - y0) / (y1 - y0));
  const topIdx = days.reduce((best, d, i, arr) => (d.v > arr[best].v ? i : best), 0);
  const pts = days.map((d, i) => [px(i), py(d.v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (padT + ih) + ' L' + pts[0][0].toFixed(1) + ' ' + (padT + ih) + ' Z';
  const grid = [20000, 25000, 30000];
  const label = v => (v / 10000).toFixed(v % 10000 === 0 ? 0 : 1) + ' 万';
  return (
    <svg width={W} height={H} viewBox={'0 0 ' + W + ' ' + H} style={{ display: 'block', maxWidth: '100%' }} role="img" aria-label="近 7 天营业额折线">
      {grid.map(g => (
        <g key={g}>
          <line x1={padL} x2={W - padR} y1={py(g)} y2={py(g)} stroke="var(--line)" strokeWidth="1" />
          <text x={padL - 10} y={py(g) + 4} textAnchor="end" fontSize="12" fill="var(--ink-2)">{label(g)}</text>
        </g>
      ))}
      <path d={area} style={{ fill: 'var(--brand-soft)' }} />
      <path d={line} fill="none" stroke="var(--brand)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r={i === topIdx ? 4 : 2.4}
                fill={i === topIdx ? 'var(--brand)' : 'var(--card)'}
                stroke="var(--brand)" strokeWidth={i === topIdx ? 2 : 1.6} />
      ))}
      <text x={pts[topIdx][0]} y={pts[topIdx][1] - 11} textAnchor={topIdx > 3 ? 'end' : 'start'}
            fontSize="12" fontWeight="600" fill="var(--brand)">¥31,240</text>
      {days.map((d, i) => (
        <text key={d.w} x={px(i)} y={H - 8} textAnchor="middle" fontSize="12" fill="var(--ink-2)">{d.w}</text>
      ))}
    </svg>
  );
}

          <rect x="20" y="150" width="34" height="1" style={{ fill: 'var(--ink)' }} opacity=".18" />

function CalendarPage(props) {
  const [view, setView] = useState('month');
  const [shift, setShift] = useState(null);
  const [zone, setZone] = useState('后厨');
  const [batches, setBatches] = useState([]);

  const cal = D.cal;
  /* mock 把 10/25 钉在周六（周六 = 第 6 列，索引 5），据此倒推 10/1 落在第 3 列 → 前导 2 格 */
  const leads = ((5 - (cal.today - 1)) % 7 + 7) % 7;
  const cells = [];
  for (let i = 0; i < leads; i++) cells.push(null);
  for (let d = 1; d <= 31; d++) cells.push(d);
  while (cells.length < 35) cells.push(null);

  const writeList = batches.reduce((acc, b) => acc.concat(b.items), []);
  function writesOn(day) { return writeList.filter(w => w.day === day); }

  function pickShift(k) { setShift(k); }
  function pickZone(z) { setZone(z); }

  function clickCell(day) {
    if (!shift) return;
    const key = shift + '|' + zone;
    setBatches(prev => {
      const next = prev.slice();
      const last = next[next.length - 1];
      if (last && last.key === key) {
        next[next.length - 1] = { key: key, items: last.items.concat([{ day: day, shift: shift, zone: zone }]) };
      } else {
        next.push({ key: key, items: [{ day: day, shift: shift, zone: zone }] });
      }
      return next;
    });
  }

  function undo() {
    if (!batches.length) return;
    setBatches(batches.slice(0, batches.length - 1));
  }

  const hint = shift
    ? '已选 ' + (shift === 'off' ? '休' : { am: '早', mid: '中', pm: '晚' }[shift]) + '班（' + zone + '），点日期写入'
    : '先选班次，再点日期写入';

  return (
    <DeskShell role={props.role} active="people" rail={<CalendarRail />}>
      <div style={calS.wrap}>
        <div style={calS.head}>
          <div>
            <h1 style={calS.h1}>{cal.year} 年 {cal.month} 月</h1>
            <Underline />
            <div style={{ marginTop: 8, fontSize: 13, color: 'var(--ink-2)' }}>
              {view === 'month' ? '整月排班，28 人花名册' : '第 4 周，10/19 – 10/25'}
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ display: 'flex', border: '1px solid var(--line-strong)', borderRadius: 8, overflow: 'hidden' }}>
              {[{ k: 'month', t: '月' }, { k: 'week', t: '周' }].map(v => {
                const on = v.k === view;
                return (
                  <button key={v.k} onClick={() => setView(v.k)} style={{
                    height: 36, width: 46, fontSize: 14, fontWeight: 500, cursor: 'pointer',
                    background: on ? 'var(--card-2)' : 'transparent', color: on ? 'var(--ink)' : 'var(--ink-2)'
                  }}>{v.t}</button>
                );
              })}
            </div>
          </div>
        </div>

        <div style={calS.legend}>
          {CAL_LEGEND.map(l => (
            <span key={l.t} style={calS.lgItem}>
              {l.k === 'am' ? <CalLegendSwatch k="班" /> : <CalLegendSwatch color={CAL_BAR[l.k]} />}
              {l.t}
            </span>
          ))}
          <span style={calS.lgItem}><CalLegendSwatch color="transparent" dash />未排</span>
          <span style={calS.lgItem}><span style={{ width: 16, height: 4, borderRadius: 2, background: 'var(--amber-soft)', border: '1px solid var(--amber)' }} />待批</span>
        </div>

        <div style={calS.wkHead}>
          {cal.weekdays.map(w => (
            <div key={w} style={{ fontSize: 13, color: 'var(--ink-2)', textAlign: 'center' }}>{w}</div>
          ))}
        </div>

        <div style={calS.grid}>
          {cells.map((day, idx) => {
            if (!day) return <div key={'e' + idx} />;
            const isToday = day === cal.today;
            const isLeave = cal.leaveDays.indexOf(day) >= 0;
            const isPending = day === cal.pendingDay;
            const unsched = cal.unscheduled.indexOf(day) >= 0;
            const ws = writesOn(day);
            const delta = ws.reduce((s, w) => s + (w.shift === 'off' ? -1 : 1), 0);
            const count = cal.counts[day - 1] + delta;
            const base = Math.max(6, Math.min(11, cal.counts[day - 1] - 16));
            const am = Math.ceil(base * 0.45), mid = Math.ceil(base * 0.75);
            const extraShift = isLeave ? ['leave'] : (isPending ? ['leave'] : []);
            const barKinds = [];
            if (!unsched) {
              for (let i = 0; i < base; i++) barKinds.push(i < am ? 'am' : (i < mid ? 'mid' : 'pm'));
              extraShift.forEach(k => barKinds.push(k));
            }
            ws.forEach(w => barKinds.push(w.shift));
            const dim = view === 'week' && (day < 19 || day > 25);
            return (
              <div key={day} className={shift ? 'cell press' : 'cell'}
                   onClick={() => clickCell(day)}
                   style={Object.assign({}, calS.cell, {
                     border: '1px ' + (unsched ? 'dashed' : 'solid') + ' ' + (isToday ? 'var(--brand)' : (ws.length ? 'var(--line-strong)' : 'var(--line)')),
                     background: dim ? 'var(--bg)' : 'var(--card)',
                     cursor: shift ? 'pointer' : 'default'
                   })}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 20 }}>
                  <span className="num" style={{ fontSize: 13, fontWeight: 600, color: isToday ? 'var(--brand)' : 'var(--ink)' }}>{day}</span>
                  {isLeave || isPending ? (
                    <span style={{ display: 'inline-flex', alignItems: 'center', height: 18, padding: '0 6px', borderRadius: 999, background: 'var(--amber-soft)', color: 'var(--amber)', fontSize: 13, fontWeight: 600, lineHeight: 1 }}>待批</span>
                  ) : null}
                  {unsched ? <span style={{ fontSize: 13, color: 'var(--ink-2)' }}>未排</span> : null}
                </div>
                <div style={calS.bars}>
                  {barKinds.slice(0, 12).map((k, i) => (
                    <span key={i} style={Object.assign({}, calS.bar, { background: CAL_BAR[k] })} />
                  ))}
                </div>
                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <span className="num" style={{ fontSize: 13, color: 'var(--ink-2)' }}>{unsched ? '—' : count}</span>
                </div>
              </div>
            );
          })}
        </div>

        <div style={calS.pen}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ fontSize: 13, color: 'var(--ink-2)', whiteSpace: 'nowrap' }}>写排班</span>
            <div style={calS.seg}>
              {[{ k: 'am', t: '早' }, { k: 'mid', t: '中' }, { k: 'pm', t: '晚' }, { k: 'off', t: '休' }].map(s => {
                const on = shift === s.k;
                return (
                  <button key={s.k} onClick={() => pickShift(s.k)} style={Object.assign({}, calS.segBtn, {
                    background: on ? 'var(--brand)' : 'var(--card-2)',
                    color: on ? 'var(--brand-ink)' : 'var(--ink-2)',
                    fontWeight: on ? 600 : 500
                  })}>{s.t}</button>
                );
              })}
            </div>
            <span style={{ width: 1, height: 22, background: 'var(--line)', flex: '0 0 auto' }} />
            <div style={calS.seg}>
              {['后厨', '前厅', '吧台'].map(z => {
                const on = zone === z;
                return (
                  <button key={z} onClick={() => pickZone(z)} style={Object.assign({}, calS.segBtn, {
                    minWidth: 52,
                    background: on ? 'var(--card-2)' : 'transparent',
                    border: '1px solid ' + (on ? 'var(--line-strong)' : 'transparent'),
                    color: on ? 'var(--ink)' : 'var(--ink-2)'
                  })}>{z}</button>
                );
              })}
            </div>
            <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, color: 'var(--ink-2)', whiteSpace: 'nowrap' }}>
              <Icon name="edit" size={15} color="var(--ink-3)" />
              笔在手上，点格子就写入
            </span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 8 }}>
            <span style={{ fontSize: 13, color: 'var(--ink-2)', whiteSpace: 'nowrap' }}>{hint}</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span style={{ fontSize: 13, color: 'var(--ink-2)' }}>{batches.length ? '已写 ' + batches.length + ' 批' : '还没写入'}</span>
              <Btn kind="ghost" h={30} fs={13} icon="undo" disabled={!batches.length} onClick={undo}>撤销最近一批</Btn>
            </div>
          </div>
        </div>
      </div>
    </DeskShell>
  );
}

function CalendarRail() {
  const leavePill = { 早班: 'brand', 中班: 'neutral', 晚班: 'neutral', 请假: 'danger' };
  const [done, setDone] = useState({});
  return (
    <div style={calS.rail}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <div>
          <span className="num" style={{ fontSize: 18, fontWeight: 600, letterSpacing: '-0.02em' }}>10.25</span>
          <span style={{ marginLeft: 8, fontSize: 15, color: 'var(--ink-2)' }}>周六</span>
        </div>
        <Pill tone="amber">待批 2</Pill>
      </div>
      <div style={{ marginTop: 4, fontSize: 13, color: 'var(--ink-2)' }}>当天名单 <Sep /> 25 人在岗</div>

      <div style={{ marginTop: 10 }}>
        {D.roster.map(p => (
          <div key={p.name} style={calS.row}>
            <span style={{ width: 24, height: 24, borderRadius: 12, background: 'var(--card-2)', color: 'var(--ink-2)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 600, flex: '0 0 auto' }}>{p.name.charAt(0)}</span>
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 14, fontWeight: 600, letterSpacing: '-0.01em' }}>{p.name}</span>
                <span style={{ fontSize: 13, color: 'var(--ink-2)' }}>{p.role}</span>
              </div>
              <div style={{ marginTop: 1, fontSize: 13, color: 'var(--ink-2)', display: 'flex', alignItems: 'center' }}>
                {p.zone}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <Pill tone={leavePill[p.shift] || 'neutral'}>{p.shift}</Pill>
              <span className="num" style={{ fontSize: 13, color: 'var(--ink-2)' }}>{p.time}</span>
            </div>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--line-strong)' }}>
        <div style={{ fontSize: 17, fontWeight: 600, letterSpacing: '-0.02em' }}>待批请假</div>
        <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 6 }}>
          {D.pendingLeave.map(l => {
            const key = l.name + l.range;
            const state = done[key];
            return (
              <div key={key} style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 10, padding: '8px 11px' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{l.name} <span style={{ fontSize: 13, fontWeight: 500, color: 'var(--ink-2)' }}>{l.type}</span></span>
                  <span className="num" style={{ fontSize: 13, color: 'var(--ink-2)' }}>{l.range}</span>
                </div>
                <div style={{ marginTop: 6, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <span style={{ fontSize: 13, color: 'var(--ink-2)' }}>共 <span className="num">{l.days}</span> 天</span>
                  {state ? (
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                      <Pill tone={state === 'ok' ? 'brand' : 'danger'}>{state === 'ok' ? '已批准' : '已驳回'}</Pill>
                      <button onClick={() => setDone(Object.assign({}, done, { [key]: null }))}
                              style={{ fontSize: 13, color: 'var(--ink-2)', textDecoration: 'underline', textUnderlineOffset: 3, cursor: 'pointer' }}>撤销</button>
                    </span>
                  ) : (
                    <span style={{ display: 'flex', gap: 6 }}>
                      <Btn h={30} fs={13} onClick={() => setDone(Object.assign({}, done, { [key]: 'ok' }))}>批准</Btn>
                      <Btn kind="outline" h={30} fs={13} onClick={() => setDone(Object.assign({}, done, { [key]: 'no' }))}>驳回</Btn>
                    </span>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--line)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, height: 38, cursor: 'pointer' }}>
          <Icon name="calendar" size={17} color="var(--ink-2)" />
          <span style={{ fontSize: 14, fontWeight: 600 }}>固定班规则</span>
          <span style={{ fontSize: 13, color: 'var(--ink-2)' }}><span className="num">{D.cal.fixed}</span> 条生效中</span>
          <span style={{ marginLeft: 'auto' }}><Icon name="chevron" size={16} color="var(--ink-3)" /></span>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { TodayPage, SalesPage, DailyPage, CalendarPage });

})();

</script>
<script type="text/babel">
/* dir-2 · 作业流 —— 入口：?p= today|sales|daily|calendar，?role= boss|manager|chef|staff */

(function () {

function readParams() {
  const q = new URLSearchParams(window.location.search);
  /* window.__PAGE__ / __ROLE__ 是静态体检（file:// 下没有 query）时的兜底 */
  return {
    page: window.__PAGE__ || q.get('p') || 'today',
    role: window.__ROLE__ || q.get('role') || 'manager'
  };
}

function App() {
  const init = readParams();
  const [page, setPage] = React.useState(init.page);
  const [tab, setTab] = React.useState(init.page === 'daily' ? 'floor' : 'today');

  /* tab 只接本次真有的两屏手机页：现场 = 日常验收，今天 = 手机版今天。
     厨房 / 我的 两键没有对应页面，不接跳转。 */
  function onTab(k) {
    if (k === 'floor') { setPage('daily'); setTab('floor'); }
    else if (k === 'today') { setPage('mtoday'); setTab('today'); }
  }

  const map = {
    today: window.TodayPage,
    sales: window.SalesPage,
    daily: window.DailyPage,
    calendar: window.CalendarPage,
    mtoday: window.MobileTodayPage || window.TodayPage
  };
  const Page = map[page] || window.TodayPage;
  return <Page role={init.role} tab={tab} onTab={onTab} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

})();

</script>
</body>
